<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; }
        .container { padding: 20px; border: 1px solid #ddd; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #0b57d0; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 th:text="'Hello ' + ${name} + '!'">Hello User!</h2>
        <p>This is a quick reminder that <strong><span th:text="${contestName}">Contest</span></strong> on <span th:text="${platform}">Platform</span> is starting soon!</p>
        <p><strong>Start Time:</strong> <span th:text="${time}">Time</span></p>
        <p>Get ready and good luck!</p>
        <a th:href="${url}" class="btn">View Contest</a>
    </div>
</body>
</html>
